<!DOCTYPE html>
<!--
  hexkeep-unit-render.html — bakes the walk and melee atlases for the attackers
  that the newer regions bring. Driven headlessly by tools/hexkeep-bake.cjs:

    node tools/hexkeep-bake.cjs units

  Same rig, crop window and sheet layout as the original skeleton bake
  (tools/render-hexkeep-walk.cjs / -combat.cjs), so every sheet drops straight
  into the .hk-walker box: 24 frames across, 6 headings down, 192px cells.
  The original raider sheets are left alone; only walk.js is rewritten, with the
  raider timings preserved and the new kinds added under `variants`.
-->
<html>
<head>
<meta charset="utf-8">
<script src="/tools/vendor/three.min.js"></script>
<script src="/tools/vendor/GLTFLoader.js"></script>
</head>
<body>
<script>
'use strict';
const post=(name,body)=>fetch('/_bake/'+name,{method:'POST',body});
const UNITS=[
 {kind:'brute',model:'Skeleton_Warrior',scale:.38,walk:'Walking_C',fight:'2H_Melee_Attack_Chop'},
 {kind:'runner',model:'Rogue',scale:.36,walk:'Running_A',fight:'1H_Melee_Attack_Stab'},
 {kind:'shaman',model:'Skeleton_Mage',scale:.38,walk:'Walking_B',fight:'Spellcast_Shoot'},
 // The defenders are Knights too, so the enemy knight is re-inked in dark iron
 // to never read as one of your own soldiers.
 {kind:'knight',model:'Knight',scale:.36,walk:'Walking_A',fight:'1H_Melee_Attack_Chop',tint:0x4a4d63},
 {kind:'warlock',model:'Mage',scale:.36,walk:'Walking_B',fight:'Spellcast_Shoot'}
];
// ?only=knight,warlock rebakes a subset and keeps every other sheet and timing.
const only=new URLSearchParams(location.search).get('only');
(async()=>{try{
 const T=THREE,loader=new T.GLTFLoader();
 const renderer=new T.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});
 renderer.setSize(1600,900);renderer.outputEncoding=T.sRGBEncoding;
 renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
 const camera=new T.OrthographicCamera(-10.7,10.7,6.019,-6.019,.1,100);
 camera.position.set(8,13,18);camera.lookAt(0,0,0);camera.updateMatrixWorld();

 async function sheet(unit,clipName){
  const asset=await loader.loadAsync('/assets/models/duel/'+unit.model+'.glb'),model=asset.scene;
  const clip=asset.animations.find(c=>c.name===clipName);
  if(!clip)throw Error(clipName+' missing on '+unit.model);
  model.scale.setScalar(unit.scale);
  if(unit.tint)model.traverse(o=>{if(o.isMesh){o.material=o.material.clone();o.material.color.setHex(unit.tint);}});
  const pivot=new T.Group();pivot.add(model);
  const scene=new T.Scene();scene.add(pivot);
  scene.add(new T.HemisphereLight(0xfff5de,0x536e68,.85));
  const sun=new T.DirectionalLight(0xffefce,1.3);sun.position.set(-8,16,7);scene.add(sun);
  const mixer=new T.AnimationMixer(model);mixer.clipAction(clip).play();
  const frames=24,directions=6,size=192,canvas=document.createElement('canvas');
  canvas.width=frames*size;canvas.height=directions*size;const ctx=canvas.getContext('2d');
  for(let row=0;row<directions;row++)for(let frame=0;frame<frames;frame++){
   pivot.rotation.y=Math.PI/6+row*Math.PI/3;
   mixer.setTime(clip.duration*frame/frames);model.updateMatrixWorld(true);
   renderer.render(scene,camera);
   ctx.drawImage(renderer.domElement,704,290,size,size,frame*size,row*size,size,size);
  }
  return {png:canvas.toDataURL('image/png').split(',')[1],duration:clip.duration*1000};
 }

 const current=await (await fetch('/assets/hexkeep/walk.js')).text();
 const raider=JSON.parse(current.slice(current.indexOf('{'),current.lastIndexOf('}')+1));
 const variants=Object.assign({},raider.variants||{});
 for(const unit of UNITS.filter(u=>!only||only.split(',').includes(u.kind))){
  const walk=await sheet(unit,unit.walk),fight=await sheet(unit,unit.fight);
  await post('enemy-'+unit.kind+'-walk.png',walk.png);
  await post('enemy-'+unit.kind+'-fight.png',fight.png);
  variants[unit.kind]={frames:24,directions:6,duration:walk.duration,clip:unit.walk,fight:unit.fight,model:unit.model};
 }
 renderer.dispose();
 await post('walk.js',btoa('window.HEXKEEP_WALK = '+JSON.stringify(Object.assign({},raider,{variants}))+';\n'));
 await post('_done','');
}catch(e){await post('_error',String(e&&e.stack||e));}})();
</script>
</body>
</html>
